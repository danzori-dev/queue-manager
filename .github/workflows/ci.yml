name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-go@v7
                with:
                    go-version-file: go.mod
                    cache: false

            -   uses: golangci/golangci-lint-action@v9
                with:
                    version: v2.14

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-go@v7
                with:
                    go-version-file: go.mod

            -   name: go.mod is tidy
                run: go mod tidy -diff

            -   name: build
                run: go build ./...

    vulncheck:
        name: Vulncheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: golang/govulncheck-action@v1
              with:
                  go-version-file: go.mod